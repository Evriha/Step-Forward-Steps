<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Forward — Test</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f7f7f5; color: #18181b; max-width: 640px; margin: 0 auto; }
  h1 { color: #ea580c; font-size: 22px; }
  .product { background: #fff; padding: 14px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .product-name { font-weight: 800; margin-bottom: 4px; }
  .product-meta { font-size: 13px; color: #666; }
  .price { color: #ea580c; font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
  .error { background: #fee; color: #c00; padding: 14px; border-radius: 10px; line-height: 1.5; }
  .ok { background: #e7f8ec; color: #0a7a3b; padding: 12px; border-radius: 10px; margin-bottom: 16px; font-weight: 600; }
  .loading { color: #666; padding: 20px 0; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<h1>👟 Step Forward — тест бази</h1>
<div id="status" class="loading">Завантаження…</div>
<div id="list"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://wxsivaeddadjotewtvhv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WTvrym-NaOP1BEEK0XaM1A_5pzM9Dmc';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async () => {
  const status = document.getElementById('status');
  const list = document.getElementById('list');

  const { data, error } = await supabase
    .from('products')
    .select(`
      slug, category, type, season, price_kopecks, rating,
      product_translations (lang, name)
    `)
    .eq('is_published', true)
    .order('created_at', { ascending: false });

  if (error) {
    status.innerHTML = `<div class="error">
      ❌ <b>Помилка:</b> ${error.message}<br>
      <small>Code: ${error.code || 'n/a'}</small>
    </div>`;
    console.error(error);
    return;
  }

  status.innerHTML = `<div class="ok">✅ База підключена. Знайдено товарів: ${data.length}</div>`;

  list.innerHTML = data.map(p => {
    const uk = p.product_translations.find(t => t.lang === 'uk');
    const name = uk ? uk.name : p.slug;
    const price = (p.price_kopecks / 100).toLocaleString('uk-UA');
    return `
      <div class="product">
        <div>
          <div class="product-name">${name}</div>
          <div class="product-meta">${p.category} · ${p.type} · ${p.season}</div>
        </div>
        <div class="price">${price} ₴<br><small style="color:#888">★ ${p.rating}</small></div>
      </div>
    `;
  }).join('');

  console.log('✅ Завантажено товарів:', data.length);
})();
</script>

</body>
</html>
